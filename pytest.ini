# pytest.ini 草案 —— 测试收集面锁定（运营/测试体系-20261007，2026-10-07）
#
# 背景：全仓 test_*.py 共 1675 件，其中 1581 件藏在 venv 系目录内（各嵌套虚拟环境自带测试件），
#       裸 pytest 无配置时全数误收导致收集爆炸/导入失败。本件双闸锁定：
#       闸一 testpaths 把默认收面钉在 tests + 建库/scripts/tests（合计 91 档，2026-10-07 普查口径）；
#       闸二 norecursedirs 对递归收集再加排除带。
# 转正方式：本件改名 pytest.ini 落仓根即生效（当前位于草案目录，pytest 不自动读取）。
#
# 实测要点（详见同目录 依赖冻结-核验-20261007.md）：
#   ① tests/ 与 建库/scripts/tests/ 均含 __init__.py 且各自父目录无 __init__.py，两处同以
#      包名 "tests" 导入；默认 prepend 模式同收两目录时唯一同名档 test_smoke_accept_answers.py
#      触发 42 档连锁收集错误（实测：1061 collected / 42 errors）。--import-mode=importlib
#      修复为 2189 item 零错误。
#   ② 残余已知缺口（转正前置待办）：importlib 模式下同名档 test_smoke_accept_answers.py
#      仍是 sys.modules 同名缓存——scripts 侧 74 item 不被收集、repo 侧 31 item 在 scripts
#      路径下幽灵重复。根治需仓内动作（单侧改名或合并该档），ini 层无法消除。
#   ③ norecursedirs 按"目录基名"fnmatch 匹配：含路径分隔符的写法（*/venv、建库/raw 等）为
#      声明性护栏，实际防误收主闸是 testpaths（变名 venv 如 venv-rerank 不在收面路径内，同理被闸一挡住）。
#   ④ 仓根 test_bm25.py / test_multiquery.py 两档不在 testpaths、按本草案不收集（口径见核验档）。
#   ⑤ CI 勿以 venv 或仓根裸目录作 pytest 显式参数：显式参数会越过 norecursedirs 对参数根自身的
#      排除（实测 pytest venv 误收 15730 item/180 错）。

[pytest]
addopts =
    --import-mode=importlib
    # 修复同收 tests 与 建库/scripts/tests 时的包名撞车（见头部实测要点①）
testpaths =
    tests
    # 主测试目录：服务/前端e2e/检索/门禁类，49 档 1061 item
    建库/scripts/tests
    # 建库脚本单测目录：切块/嵌入/评测门禁类，42 档 1171 item
norecursedirs =
    venv
    # 仓根 venv（73 包 freeze 基线所在，内含大量第三方测试件）
    */venv
    # 任意层级嵌套 venv（声明性护栏，见头部实测要点③）
    建库/raw
    # 原始语料区：无测试档（普查=0），防误扫大目录拖慢收集
    建库/work
    # 建库工作区：无测试档，同上
    node_modules
    # 前端依赖树：npm 侧无 pytest 收集物
    .git
    # git 元数据目录
    建库/chunks-backup-*
    # 切块历史备份区（如 chunks-backup-20260918）：非测试件，防误收
